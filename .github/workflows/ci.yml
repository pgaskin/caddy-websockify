name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    - cron: '15 6 * * 1' # Monday 06:15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: GONOPROXY="$(go list -m)" go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base="$(git describe --tags --abbrev=0 --match 'v*' HEAD^)"
    if: github.event_name != 'schedule'

  xcaddy:
    name: xcaddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/github-script@v9
        with:
          script: |
            const list = async (...args) => JSON.parse((await exec.getExecOutput('go', ['list', '-m', '-json', ...args])).stdout)
            core.setOutput('module', (await list()).Path)
            core.setOutput('version', (await list('github.com/caddyserver/caddy/v2')).Version)
        id: list
      - run: go run github.com/caddyserver/xcaddy/cmd/xcaddy@latest build "$CADDY_VERSION" --with "${MODULE}=." --output "$RUNNER_TEMP/caddy"
        env:
          MODULE: ${{ steps.list.outputs.module }}
          CADDY_VERSION: ${{ steps.list.outputs.version }}
      - run: '"${RUNNER_TEMP}/caddy" version'
      - run: '"${RUNNER_TEMP}/caddy" list-modules | grep -Fx http.handlers.websockify'
    if: github.event_name != 'schedule'

  xcaddy-latest:
    name: xcaddy (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - uses: actions/github-script@v9
        with:
          script: |
            const list = async (...args) => JSON.parse((await exec.getExecOutput('go', ['list', '-m', '-json', ...args])).stdout)
            core.setOutput('module', (await list()).Path)
            core.setOutput('version', (await list('github.com/caddyserver/caddy/v2@latest')).Version)
        id: list
      - run: go run github.com/caddyserver/xcaddy/cmd/xcaddy@latest build "${CADDY_VERSION}" --with "${MODULE}=." --output "${RUNNER_TEMP}/caddy"
        env:
          MODULE: ${{steps.list.outputs.module}}
          CADDY_VERSION: ${{steps.list.outputs.version}}
      - run: '"${RUNNER_TEMP}/caddy" version'
      - run: '"${RUNNER_TEMP}/caddy" list-modules | grep -Fx http.handlers.websockify'
